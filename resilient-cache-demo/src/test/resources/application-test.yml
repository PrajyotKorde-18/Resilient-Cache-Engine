spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379

resilient-cache:
  enabled: true
  provider: caffeine
  default-ttl: 5m
  caffeine:
    maximum-size: 1000
    expire-after-write: 5m
